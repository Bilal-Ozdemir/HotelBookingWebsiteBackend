<!-- src/app/user-registration/user-registration.component.html -->
<div id="user-registration" class="container">
  <div class="card">
    <h2>User Registration</h2>
    <form #f="ngForm" (ngSubmit)="onSubmit(f)" id="registerForm">
      <div class="form-group">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="firstName" ngModel required />
      </div>
      <div class="form-group">
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="lastName" ngModel required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" ngModel required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" ngModel required />
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password"
               name="confirmPassword" ngModel required />
      </div>
      <button type="submit" class="btn">Register</button>
    </form>
    <p>Already have an account? <a routerLink="/login">Login here</a></p>
  </div>
</div>
