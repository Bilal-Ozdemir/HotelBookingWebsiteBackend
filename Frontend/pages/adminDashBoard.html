<!-- File: adminDashBoard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./../styles/global.css" />
    <title>Admin Dashboard</title>
    <style>
     
      .bookings-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      .bookings-table th, .bookings-table td { border: 1px solid #ddd; padding: 0.5rem; }
      .bookings-table th { background: #f4f4f4; }

      .rooms-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      .rooms-table th, .rooms-table td { border: 1px solid #ddd; padding: 0.5rem; }
      .rooms-table th { background: #f4f4f4; }
    </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Hotel Management</div>
    <div class="nav-links">
      <span id="authLinks">
        <a href="userLogin.html">Login</a>
        <a href="userRegistration.html">Register</a>
      </span>
      <span id="userProfileLink"  hidden></span>
      <span id="adminLink"></span>
    </div>
  </nav>
  

       
        <div id="dashboard-cards" class="dashboard-grid">
            <div class="dashboard-card">
                <h3>Total Bookings</h3>
                <p id="total-bookings">0</p>
            </div>
            <div class="dashboard-card">
                <h3>Occupancy Rate</h3>
                <p id="occupancy-rate">0%</p>
            </div>
            <div class="dashboard-card">
                <h3>Rooms Available</h3>
                <p id="rooms-available">0</p>
            </div>
            <div class="dashboard-card">
                <h3>Revenue</h3>
                <p id="total-revenue">$0</p>
            </div>
        </div>

        
        <div id="bookings-panel" class="card" style="display:none; margin-top:20px;">
            <h3>All Bookings</h3>
            <table class="bookings-table">
              <thead>
                <tr>
                  <th>Booking ID</th><th>User Email</th><th>Room</th>
                  <th>Check-In</th><th>Check-Out</th><th>Paid</th>
                </tr>
              </thead>
              <tbody id="bookings-body">
                <tr><td colspan="6">Loading...</td></tr>
              </tbody>
            </table>
        </div>

        
        <div id="rooms-panel" class="card" style="display:none; margin-top:20px;">
            <h3>Rooms Management</h3>
            
            <table class="rooms-table">
              <thead>
                <tr>
                  <th>Room #</th><th>Type</th><th>Price</th><th>Actions</th>
                </tr>
              </thead>
              <tbody id="rooms-body">
                <tr><td colspan="4">Loading...</td></tr>
              </tbody>
            </table>
           
            <div style="margin-top: 1rem;">
              <h4 id="room-form-title">Add New Room</h4>
              <form id="room-form">
                <div class="form-group">
                  <label for="room-number">Room Number</label>
                  <input type="text" id="room-number" required />
                </div>
                <div class="form-group">
                  <label for="room-type">Room Type</label>
                  <select id="room-type" required></select>
                </div>
                <div class="form-group">
                  <label for="room-price">Price (USD per night)</label>
                  <input type="number" step="0.01" id="room-price" required />
                </div>
                <button type="submit" class="btn" id="room-form-submit">Add Room</button>
                <div id="errorMessages" class="error-messages"></div>
              </form>
            </div>
        </div>
    </div>

    <script type="module" src="./../pages/Frontend/scripts/adminDashboard.js"></script>
    <script type="module" src="./../pages/Frontend/scripts/nav.js"></script>
    <script type="module">
      import './Frontend/scripts/errors.js';
    </script>
    <script type="module" src="./Frontend/scripts/nav.js"></script>
</body>
</html>
