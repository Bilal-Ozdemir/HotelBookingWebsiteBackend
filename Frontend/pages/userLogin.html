<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./../styles/global.css" />
  <title>User Login</title>
</head>
<body>
  <div id="user-login" class="container">
    <nav class="navbar">
      <div class="logo">
        <a href="homePage.html" style="color: inherit; text-decoration: none;">Hotel Management</a>
      </div>
      <div class="nav-links">
        <a href="homePage.html">Home</a>
        <a href="rooms.html">Rooms</a>
        <a href="bookingform.html">Booking</a>
        <a href="contactPage.html">Contact</a>
        <a href="userLogin.html">Login</a>
        <a href="userRegistration.html">Register</a>
      </div>
    </nav>
    <div class="card">
      <h2>User Login</h2>
      <form>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
      <p>Don't have an account? <a href="userRegistration.html">Register here</a></p>
    </div>
  </div>
</body>
</html>
