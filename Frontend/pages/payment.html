<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Payment</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 2rem auto; }
    input, button { width: 100%; padding: .5rem; margin: .5rem 0; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: .25rem; }
    #confirmation { background: #e0ffe0; padding: 1rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Complete Your Payment</h1>

  <div id="booking-summary"></div>

  <form id="payment-form">
    <div class="field">
      <label for="cardName">Name on Card</label>
      <input type="text"
             id="cardName"
             required
             value="John Doe" />
    </div>
    <div class="field">
      <label for="cardNumber">Card Number</label>
      <input type="text"
             id="cardNumber"
             pattern="\d{16}"
             required
             value="1234567812345678" />
    </div>
    <div class="field">
      <label for="expiry">Expiry (MM/YY)</label>
      <input type="text"
             id="expiry"
             pattern="(0[1-9]|1[0-2])\/\d{2}"
             required
             value="12/34" />
    </div>
    <div class="field">
      <label for="cvc">CVC</label>
      <input type="text"
             id="cvc"
             pattern="\d{3}"
             required
             value="123" />
    </div>
    <button type="submit">Submit Payment</button>
  </form>

  <div id="confirmation" style="display:none;"></div>

  <script src="../pages/Frontend/scripts/payment.js"></script>
</body>
</html>
