<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="../styles/global.css" />
  <title>My Bookings</title>
</head>
<body>
  <!-- Redirect if not logged in -->
  <script>
    if (!localStorage.getItem('token')) {
      window.location.href = 'userLogin.html?redirect=userProfile.html';
    }
  </script>

  <!-- Shared nav -->
  <nav class="navbar">
    <div class="logo">Hotel Management</div>
    <div class="nav-links">
      <a href="homePage.html">Home</a>
      <a href="roomViewPage.html">Rooms</a>
      <a href="bookingform.html">Book</a>
      <a href="contactPage.html">Contact</a>
      <span id="userProfileLink"></span>
      <!-- auth links will be replaced by nav.js -->
      <span id="authLinks">
        <a href="userLogin.html">Login</a>
        <a href="userRegistration.html">Register</a>
      </span>
      <span id="adminLink"></span>
    </div>
  </nav>

  <!-- Inline error container -->
  <div id="errorMessages" class="error-messages"></div>

  <div id="user-profile" class="container">
    <div class="card">
      <div class="profile-header">
        <!-- replace with real avatar path if you have one -->
        
        <div>
          <h2 id="user-name">Loading…</h2>
          <p id="user-email"></p>
        </div>
      </div>

      <h3>My Bookings</h3>
      <table class="bookings-table">
        <thead>
          <tr>
            <th>Booking ID</th>
            <th>Room Type</th>
            <th>Room #</th>
            <th>Check‑In</th>
            <th>Check‑Out</th>
            <th>Paid</th>
          </tr>
        </thead>
        <tbody id="bookings-body">
          <tr><td colspan="6">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Load our shared modules and page logic -->
  <script type="module" src="./Frontend/scripts/errors.js"></script>
  <script type="module" src="./Frontend/scripts/userProfile.js"></script>
  <script type="module" src="./Frontend/scripts/nav.js"></script>
</body>
</html>
