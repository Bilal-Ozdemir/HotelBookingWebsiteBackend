<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/global.css">
  <title>Payment</title>
</head>
<body>
  <div class="container">

    
    <nav class="navbar">
      <div class="logo">Hotel Management</div>
      <div class="nav-links">
        <a href="homePage.html">Home</a>
        <a href="roomViewPage.html">Rooms</a>
        <a href="bookingform.html">Booking</a>
        <a href="contactPage.html">Contact</a>
        <a href="userLogin.html">Login</a>
        <a href="userRegistration.html">Register</a>
      </div>
    </nav>

    <div class="card">
      <h2>Complete Your Payment</h2>

      <div id="booking-summary"></div>

      <form id="payment-form">
        <div class="form-group">
          <label for="cardName">Name on Card</label>
          <input type="text" id="cardName" required value="John Doe" />
        </div>
        <div class="form-group">
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" pattern="\d{16}" required value="1234567812345678" />
        </div>
        <div class="form-group">
          <label for="expiry">Expiry (MM/YY)</label>
          <input type="text" id="expiry" pattern="(0[1-9]|1[0-2])\/\d{2}" required value="12/34" />
        </div>
        <div class="form-group">
          <label for="cvc">CVC</label>
          <input type="text" id="cvc" pattern="\d{3}" required value="123" />
        </div>
        <button type="submit" class="btn">Submit Payment</button>
      </form>

      <div id="confirmation" style="display:none;"></div>
    </div>

    <script src="../pages/Frontend/scripts/payment.js"></script>
  </div>
</body>
</html>
