<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/global.css">
  <title>User Registration</title>
</head>
<body>
  <div id="user-registration" class="container">
    <nav class="navbar">
      <div class="logo">Hotel Management</div>
      <div class="nav-links">
        <a href="homePage.html">Home</a>
        <a href="roomViewPage.html">Rooms</a>
        <a href="bookingform.html">Booking</a>
        <a href="contactPage.html">Contact</a>
        <a href="userLogin.html">Login</a>
        <a href="userRegistration.html">Register</a>
      </div>
    </nav>

    <div class="card">
      <h2>User Registration</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" required>
        </div>
        <div class="form-group">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" required>
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
      <p>Already have an account? <a href="userLogin.html">Login here</a></p>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const firstName = document.getElementById('first-name').value.trim();
      const lastName = document.getElementById('last-name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        return alert('Passwords do not match');
      }

      // Backend expects Username, Email, Password
      const username = `${firstName} ${lastName}`;

      try {
        const response = await fetch('http://localhost:5252/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const result = await response.json();
        if (!response.ok) {
          return alert(result.error || 'Registration failed');
        }
        alert(result.message || 'Registration successful');
        window.location.href = 'userLogin.html';
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });
  </script>
</body>
</html>
