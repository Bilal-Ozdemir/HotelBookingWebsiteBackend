<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="../styles/global.css" />
  <title>Booking Form</title>
</head>
<body>
  <!-- 1. Redirect if not logged in -->
  <script>
    if (!localStorage.getItem('token')) {
      // send to login, then come back here
      window.location.href = 'userLogin.html?redirect=bookingform.html';
    }
  </script>

  <!-- 2. Shared nav -->
  <nav class="navbar">
    <div class="logo">Hotel Management</div>
    <div class="nav-links">
      <a href="homePage.html">Home</a>
      <a href="roomViewPage.html">Rooms</a>
      <a href="bookingform.html">Book</a>
      <a href="contactPage.html">Contact</a>

      <!-- auth links will be replaced by nav.js -->
      <span id="authLinks">
        <a href="userLogin.html">Login</a>
        <a href="userRegistration.html">Register</a>
      </span>
      <span id="adminLink"></span>
    </div>
  </nav>

  <!-- 3. Booking card -->
  <div class="card container">
    <h2>Book Your Stay</h2>
    <!-- error container -->
    <div id="errorMessages" class="error-messages"></div>

    <form id="bookingForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="roomType">Room Type</label>
        <select id="roomType" required>
          <option value="" disabled>Loading room types…</option>
        </select>
      </div>
      <div class="form-group">
        <label for="checkIn">Check‑in Date</label>
        <input type="date" id="checkIn" required />
      </div>
      <div class="form-group">
        <label for="checkOut">Check‑out Date</label>
        <input type="date" id="checkOut" required />
      </div>
      <div class="form-group">
        <label for="specialRequests">Special Requests</label>
        <textarea id="specialRequests" rows="4"></textarea>
      </div>
      <button type="submit" class="btn">Confirm Booking</button>
    </form>
  </div>

  <!-- 4. Load shared scripts -->
  <script type="module" src="./Frontend/scripts/errors.js"></script>
  <script type="module" src="./Frontend/scripts/booking.js"></script>
  <script type="module" src="./Frontend/scripts/nav.js"></script>
</body>
</html>
