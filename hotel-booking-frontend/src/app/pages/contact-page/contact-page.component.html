<div id="contact" class="container">


  <div class="contact-container">
    <h2>Contact Us</h2>
    <p>If you have any questions or need assistance, please fill out the form below or reach us via phone or email.</p>
    <div class="contact-content">
      <div class="contact-form">
        <form #f="ngForm" (ngSubmit)="onSubmit(f)">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" ngModel required>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" ngModel required>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" ngModel required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" ngModel required></textarea>
          </div>
          <button type="submit" class="btn">Send Message</button>
        </form>
      </div>
      <div class="contact-info">
        <h3>Our Contact Information</h3>
        <p><strong>Address:</strong> 123 Hotel Street, City, Country</p>
        <p><strong>Phone:</strong> +1 (555) 987-6543</p>
        <p><strong>Email:</strong> info&#64;hotelmanagement.com</p>
      </div>
    </div>
  </div>

</div>
