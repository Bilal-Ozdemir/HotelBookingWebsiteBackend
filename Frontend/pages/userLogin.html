<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/global.css">
  <title>User Login</title>
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <div class="logo">Hotel Management</div>
      <div class="nav-links">
        <a href="homePage.html">Home</a>
        <a href="roomViewPage.html">Rooms</a>
        <a href="bookingform.html">Book</a>
        <a href="contactPage.html">Contact</a>
        <span id="userProfileLink"></span>
        <span id="authLinks">
          <a href="userLogin.html">Login</a>
          <a href="userRegistration.html">Register</a>
        </span>
        <span id="adminLink"></span>
      </div>
    </nav>

    <div class="card">
      <h2>User Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn">Login</button>
        <button type="button" class="btn" onclick="window.location.href='adminLogin.html'">Admin Login</button>
        <div id="errorMessages" class="error-messages"></div>
      </form>
    </div>
  </div>
  <script type="module">
    import './Frontend/scripts/errors.js';
  </script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("http://localhost:5252/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();
        if (!response.ok) return alert(result.error || "Login failed");

        localStorage.setItem("token", result.token);
        alert("Login successful");
        window.location.href = "homePage.html";
      } catch (err) {
        alert("Error: " + err.message);
      }
    });
  </script>
  <script type="module" src="./Frontend/scripts/nav.js"></script>
</body>
</html>
