<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./../styles/global.css">
    <title>Document</title>
</head>
<body>
    <div id="user-profile" class="container">
        <nav class="navbar">
            <div class="logo">Hotel Management</div>
            <div class="nav-links">
                <a href="homePage.html">Home</a>
                <a href="#">My Bookings</a>
                <a href="#">Profile</a>
                <a href="#">Logout</a>
            </div>
        </nav>
        <div class="card">
            <div class="profile-header">
                <img src="/api/placeholder/100/100" alt="Profile Picture">
                <div>
                    <h2>John Doe</h2>
                    <p>john.doe&#64;example.com</p>
                </div>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" value="+1 (555) 123-4567">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" value="123 Hotel Street, City, Country">
            </div>
            <div class="form-group">
                <label>Membership Level</label>
                <input type="text" value="Silver Member" readonly>
            </div>
            <button class="btn">Update Profile</button>
        </div>
    </div>
</body>
</html>
