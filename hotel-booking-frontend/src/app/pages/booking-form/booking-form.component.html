<div id="booking-form" class="container">

  <div class="card">
    <h2>Book Your Stay</h2>
    <form #f="ngForm" (ngSubmit)="onSubmit(f)">
      <div class="form-group">
        <label>Full Name</label>
        <input name="fullName" ngModel required />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" ngModel required />
      </div>

      <div class="form-group">
        <label>Room Type</label>
        <select name="roomType" ngModel required>
          <option value="" disabled selected>Loading rooms...</option>
        </select>
      </div>

      <div class="form-group">
        <label>Check-in Date</label>
        <input type="date" name="checkIn" ngModel required />
      </div>

      <div class="form-group">
        <label>Check-out Date</label>
        <input type="date" name="checkOut" ngModel required />
      </div>

      <div class="form-group">
        <label>Special Requests</label>
        <textarea name="specialRequests" ngModel rows="4"></textarea>
      </div>

      <button class="btn" type="submit">Confirm Booking</button>
    </form>
  </div>
</div>
