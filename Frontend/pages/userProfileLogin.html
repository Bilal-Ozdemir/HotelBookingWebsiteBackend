<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/global.css">
  <title>My Bookings</title>
</head>
<body>
  <div id="user-profile" class="container">
    <nav class="navbar">
      <div class="logo">Hotel Management</div>
      <div class="nav-links">
        <a href="homePage.html">Home</a>
        <a href="userProfile.html">My Bookings</a>
        <a href="#" id="logout-link">Logout</a>
      </div>
    </nav>

    <div class="card">
      <div class="profile-header">
        <img src="/path/to/avatar.jpg" alt="Profile Picture">
        <div>
          <h2 id="user-name">User Name</h2>
          <p id="user-email">user@example.com</p>
        </div>
      </div>

      <h3>My Bookings</h3>
      <table class="bookings-table">
        <thead>
          <tr>
            <th>Booking ID</th>
            <th>Room Type</th>
            <th>Room Number</th>
            <th>Check-In</th>
            <th>Check-Out</th>
            <th>Paid</th>
          </tr>
        </thead>
        <tbody id="bookings-body">
          <tr><td colspan="6">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <script type="module" src="../pages/Frontend/scripts/userProfile.js"></script>
  </div>
</body>
</html>
